<!DOCTYPE html>
<html>
<head>
    <title>Debug Auth</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Debug Auth & Tenant</h1>
    <div id="output"></div>
    
    <script>
        const supabaseUrl = 'https://wnqjqhqjqhqjqhqj.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InducWpxaHFqcWhxanFocWoiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTczNTU5NzI5NCwiZXhwIjoyMDUxMTczMjk0fQ.VgCOQKJOQKJOQKJOQKJOQKJOQKJOQKJOQKJOQKJOQKI';
        
        const supabase = window.supabase.createClient(supabaseUrl, supabaseKey);
        const output = document.getElementById('output');
        
        async function debugAuth() {
            try {
                // Verificar sessão atual
                const { data: session } = await supabase.auth.getSession();
                output.innerHTML += `<p><strong>Sessão:</strong> ${session.session ? 'Logado' : 'Não logado'}</p>`;
                
                if (session.session) {
                    const user = session.session.user;
                    output.innerHTML += `<p><strong>User ID:</strong> ${user.id}</p>`;
                    
                    // Buscar tenant_id
                    const { data: profile, error } = await supabase
                        .from('profiles')
                        .select('tenant_id')
                        .eq('id', user.id)
                        .single();
                    
                    if (error) {
                        output.innerHTML += `<p><strong>Erro ao buscar profile:</strong> ${error.message}</p>`;
                    } else {
                        output.innerHTML += `<p><strong>Tenant ID:</strong> ${profile?.tenant_id || 'NULL'}</p>`;
                        
                        if (profile?.tenant_id) {
                            // Buscar eventos
                            const { data: eventos, error: eventosError } = await supabase
                                .from('evento')
                                .select('id, titulo, tipo, inicio')
                                .eq('tenant_id', profile.tenant_id)
                                .limit(5);
                            
                            if (eventosError) {
                                output.innerHTML += `<p><strong>Erro ao buscar eventos:</strong> ${eventosError.message}</p>`;
                            } else {
                                output.innerHTML += `<p><strong>Eventos encontrados:</strong> ${eventos?.length || 0}</p>`;
                                if (eventos && eventos.length > 0) {
                                    output.innerHTML += '<ul>';
                                    eventos.forEach(e => {
                                        output.innerHTML += `<li>${e.titulo} (${e.tipo}) - ${e.inicio}</li>`;
                                    });
                                    output.innerHTML += '</ul>';
                                }
                            }
                        }
                    }
                } else {
                    output.innerHTML += '<p>Usuário não está logado. Faça login primeiro.</p>';
                }
            } catch (error) {
                output.innerHTML += `<p><strong>Erro geral:</strong> ${error.message}</p>`;
            }
        }
        
        debugAuth();
    </script>
</body>
</html>
